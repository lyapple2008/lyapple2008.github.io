<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
  <title id="title">WebRTC Limiter 电平估计的 attack 与 decay</title>
  <desc id="desc">输入峰值在 20 毫秒跃升到 40000，电平估计在相邻子帧内快速跟随；输入在 60 毫秒归零后，估计值缓慢下降，约每 20 毫秒降低 1 分贝，帮助限制器平滑恢复增益。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081b30"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <style>
      .cn {font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .mono {font-family:"SFMono-Regular",Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1280" height="710" rx="28" fill="url(#background)"/>
  <rect x="27" y="27" width="1226" height="656" rx="23" fill="none" stroke="#427396" stroke-width="2" opacity=".75"/>
  <text x="68" y="82" fill="#edfaff" font-size="37" font-weight="850" class="cn">Limiter 的 attack / decay：电平快升、慢降</text>
  <text x="70" y="119" fill="#a8c7da" font-size="20" class="cn">示意输入：峰值升至 40000，持续 40 ms 后归零；图中蓝线为峰值估计，不是音频波形</text>

