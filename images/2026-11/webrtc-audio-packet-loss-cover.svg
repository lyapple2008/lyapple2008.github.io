<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WebRTC 音频丢包恢复</title>
  <desc id="desc">一条音频 RTP 时间轴中间丢失一包，后续包携带的冗余信息返回填补缺口，底部波形经过 NetEQ 后恢复连续。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182e"/>
      <stop offset=".55" stop-color="#102b48"/>
      <stop offset="1" stop-color="#071b31"/>
    </linearGradient>
    <linearGradient id="titleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0f1ff"/>
      <stop offset="1" stop-color="#3d98ef"/>
    </linearGradient>
    <linearGradient id="packetBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183f64"/>
      <stop offset="1" stop-color="#0b2644"/>
    </linearGradient>
    <linearGradient id="packetAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57351d"/>
      <stop offset="1" stop-color="#271f25"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57b8f7"/>
      <stop offset=".42" stop-color="#f7a552"/>
      <stop offset=".60" stop-color="#7be6d8"/>
      <stop offset="1" stop-color="#63c7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ea7f2" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2ea7f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a1d5f3" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#010a16" flood-opacity=".52"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1 1L12 6.5 1 12" fill="none" stroke="#f8b66a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="blueArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1 1L12 6.5 1 12" fill="none" stroke="#77d4fa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .cn { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", "Menlo", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="510" rx="820" ry="460" fill="url(#glow)"/>
  <rect x="30" y="30" width="1540" height="840" rx="34" fill="none" stroke="#81c9f5" stroke-opacity=".18" stroke-width="3"/>

  <g transform="translate(94 80)">
    <rect width="222" height="42" rx="21" fill="#1a456a" stroke="#61cfff" stroke-opacity=".65"/>
    <circle cx="25" cy="21" r="7" fill="#63d5ff"/>
    <text x="45" y="29" fill="#bceeff" font-size="19" font-weight="800" class="mono">WEBRTC / AUDIO</text>
    <text x="0" y="129" fill="url(#titleBlue)" font-size="91" font-weight="900" letter-spacing="-4" class="cn">WebRTC</text>
    <text x="412" y="129" fill="#f5fbff" font-size="88" font-weight="900" letter-spacing="-3" class="cn">音频丢包恢复</text>
    <text x="3" y="181" fill="#b1cadf" font-size="28" font-weight="600" class="cn">一包声音丢失后，怎样在播放截止前接住它？</text>
  </g>

  <g opacity=".76" class="mono" font-size="19" font-weight="700">
    <text x="105" y="365" fill="#8dcbed">RTP / 20 ms</text>
    <text x="471" y="365" fill="#f8bb75">MISSING PACKET</text>
    <text x="834" y="365" fill="#8dcbed">NEXT PACKET</text>
  </g>

  <path d="M120 497H1170" stroke="#2a5879" stroke-width="13" stroke-linecap="round"/>
  <path d="M120 497H1170" stroke="#6dc9fa" stroke-opacity=".45" stroke-width="3" stroke-dasharray="5 12"/>

  <g filter="url(#shadow)">
    <rect x="95" y="394" width="285" height="204" rx="28" fill="url(#packetBlue)" stroke="#59bffc" stroke-width="3"/>
    <rect x="111" y="409" width="253" height="173" rx="18" fill="none" stroke="#69d7ff" stroke-opacity=".18" stroke-width="2"/>
    <text x="124" y="456" fill="#c5e8fb" font-size="25" font-weight="800" class="mono">P1</text>
    <text x="124" y="550" fill="#effbff" font-size="65" font-weight="800" class="cn">正常</text>
    <circle cx="329" cy="452" r="11" fill="#54d6b2"/>

    <rect x="456" y="394" width="285" height="204" rx="28" fill="url(#packetAmber)" stroke="#ffaf64" stroke-width="3" stroke-dasharray="15 13"/>
    <text x="485" y="456" fill="#ffd1a1" font-size="25" font-weight="800" class="mono">P2</text>
    <text x="485" y="550" fill="#ffd0a5" font-size="65" font-weight="800" class="cn">丢失</text>
    <circle cx="688" cy="450" r="21" fill="#824c30" stroke="#ffc27c" stroke-width="3"/>
    <path d="M680 442L696 458M696 442L680 458" stroke="#fff2db" stroke-width="4" stroke-linecap="round"/>

    <rect x="817" y="394" width="313" height="204" rx="28" fill="url(#packetBlue)" stroke="#59bffc" stroke-width="3"/>
    <rect x="833" y="409" width="281" height="173" rx="18" fill="none" stroke="#69d7ff" stroke-opacity=".18" stroke-width="2"/>
    <text x="849" y="456" fill="#c5e8fb" font-size="25" font-weight="800" class="mono">P3</text>
    <text x="849" y="548" fill="#effbff" font-size="60" font-weight="800" class="cn">正常</text>
    <rect x="1005" y="492" width="98" height="50" rx="16" fill="#f5ae62"/>
    <text x="1054" y="526" text-anchor="middle" fill="#172942" font-size="25" font-weight="900" class="mono">FEC</text>
  </g>

  <path d="M1053 385C1044 300 916 291 840 308C744 329 694 342 637 376" fill="none" stroke="#f7b366" stroke-width="16" stroke-opacity=".27" filter="url(#softGlow)"/>
  <path d="M1053 385C1044 300 916 291 840 308C744 329 694 342 637 376" fill="none" stroke="#f7b366" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="746" y="277" width="186" height="43" rx="21" fill="#3d332d" stroke="#f7b366" stroke-opacity=".8"/>
  <text x="839" y="306" text-anchor="middle" fill="#ffe0b6" font-size="21" font-weight="800" class="cn">后包携带冗余</text>

  <g transform="translate(1236 393)" filter="url(#shadow)">
    <rect width="275" height="205" rx="31" fill="#102d4d" stroke="#77d4fa" stroke-width="3"/>
    <circle cx="78" cy="85" r="45" fill="#1b5d83" stroke="#72dcf5" stroke-width="3"/>
    <path d="M63 73H72L87 60V110L72 97H63Z" fill="#d7faff"/>
    <path d="M98 74C108 80 108 91 98 97M105 64C122 75 122 98 105 108" fill="none" stroke="#d7faff" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="82" fill="#e8faff" font-size="35" font-weight="850" class="mono">NetEQ</text>
    <text x="136" y="115" fill="#a1c8dc" font-size="21" font-weight="700" class="cn">连续播放</text>
    <rect x="34" y="150" width="207" height="4" rx="2" fill="#326282"/>
    <rect x="34" y="150" width="169" height="4" rx="2" fill="#78e1d5"/>
    <circle cx="204" cy="152" r="9" fill="#94f2df"/>
  </g>
  <path d="M1135 497H1224" fill="none" stroke="#77d4fa" stroke-width="4" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <text x="599" y="648" text-anchor="middle" fill="#fac493" font-size="22" font-weight="750" class="mono">FEC  /  NACK  /  PLC</text>

  <g transform="translate(95 681)">
    <rect width="1410" height="123" rx="28" fill="#09233e" stroke="#38627e" stroke-width="2"/>
    <text x="28" y="34" fill="#9fc7df" font-size="19" font-weight="800" class="mono">PLAYOUT TIMELINE</text>
    <text x="1377" y="34" text-anchor="end" fill="#9bc7d9" font-size="18" font-weight="700" class="cn">缺口经过恢复或隐藏后保持连续</text>
    <path d="M31 78H1378" stroke="#33617d" stroke-width="2"/>
    <path d="M45 77L69 77 81 59 95 98 110 47 126 107 143 63 158 81 185 81 202 67 218 92 231 53 248 100 265 70 282 79 305 79 324 56 339 103 357 65 375 82 398 82 415 77 448 77" fill="none" stroke="#5cc5fd" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M448 77L475 77 488 94 503 63 518 105 536 47 552 97 568 66 581 81 604 81 620 62 637 98 654 71 675 79 700 79 718 77" fill="none" stroke="#f8ad64" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M718 77L741 77 755 61 770 98 787 49 805 108 820 64 838 80 863 80 879 65 897 97 913 52 930 101 947 68 966 80 992 80 1005 60 1020 99 1038 48 1056 108 1074 62 1091 80 1116 80 1133 64 1150 99 1167 52 1184 101 1201 72 1222 79 1252 79 1272 65 1288 91 1303 76 1337 77" fill="none" stroke="#7fe4d4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="450" cy="77" r="7" fill="#f8ad64"/>
    <circle cx="720" cy="77" r="7" fill="#7fe4d4"/>
  </g>
</svg>
